# =============================================================================
# Configuración de despliegue en Render — Tu Boda Online (Static Site)
# =============================================================================
# Cubre los hallazgos de la revisión de seguridad:
#   #1 Frontend sin CSP / frame-ancestors / Referrer-Policy / Permissions-Policy
#   #3 El fallback SPA devolvía 200 text/html para cualquier ruta inexistente
#   #5 HSTS incoherente (10 años en el front, 1 año en el backend) y con preload
#      sobre un subdominio de Render que no controlamos.
#
# NOTA IMPORTANTE — el servicio actual de Render se creó desde el Dashboard,
# no desde este Blueprint. Para que estas reglas se apliquen tienes DOS vías:
#
#   A) Dashboard (efecto inmediato, sin tocar nada más):
#      Render Dashboard > tu Static Site > Settings > Redirects & Rewrites
#      y > HTTP Headers. Pega literalmente las reglas de `routes:` y `headers:`
#      de este fichero. Render las valida al pegarlas.
#
#   B) Blueprint (reproducible, recomendado a medio plazo):
#      Render Dashboard > New > Blueprint > apunta a este repositorio.
#      Opcionalmente, si prefieres mantener el servicio actual, Render te
#      ofrece "Apply" para aplicar los cambios del Blueprint encima de los
#      servicios ya existentes.
#
# Render PRESERVA las cabeceras existentes que no aparezcan en el fichero,
# así que añadir este `headers:` no elimina nada por accidente.
# =============================================================================

services:
  - type: web
    runtime: static
    name: tubodaonline

    # `pnpm build` == `ng build`, que usa `defaultConfiguration: production`
    # (outputMode: server) y genera `dist/tu-boda-online/browser` + `/server`.
    # Solo publicamos `browser`: el sitio se sirve como static site.
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist/tu-boda-online/browser
    # El sitio actual ya tiene auto-deploy activo en `main`. Se declara aquí
    # para que el Blueprint sea la fuente de verdad de toda la config.
    autoDeployTrigger: commit

    # -------------------------------------------------------------------------
    # #3 — El fallback SPA devolvía 200 para rutas inexistentes
    # -------------------------------------------------------------------------
    # Render sirve el fichero real si existe; si no, aplica la PRIMERA regla
    # que coincide (de arriba abajo). Estas reglas van ANTES del catch-all.
    #
    # DESTINO: `/__asset_not_found__.png` — y SOLO esa extensión, a propósito.
    # `.png` NO aparece entre los `source` de esta lista, así que el destino
    # nunca vuelve a evaluarse contra estas reglas (sin bucles). No añadas una
    # regla `/*.png`.
    #
    # Medido en producción (2026-10-26) con este mismo destination:
    #   · un destino inexistente SIN extensión (`/__asset_not_found__`) lo
    #     captura el catch-all `/*` y devuelve el index.html con status 200;
    #   · un destino inexistente CON extensión de asset devuelve 404 real.
    #
    # Solo se listan extensiones donde el sitio devolvía algo distinto de 404:
    #   · js css txt jpg gif zip mp4 -> Render devuelve 404 real; se fijan aquí
    #     para no depender del default del proveedor.
    #   · map json xml svg webp avif ico webm woff woff2 ttf eot -> Render
    #     devuelve 200 con cuerpo VACÍO (su "soft 404" para estos MIME types).
    #     Ese 200 vacío depende SOLO de la extensión de la ruta, NO del
    #     destination (todas las reglas comparten destination y el resultado
    #     cambia por extensión). Es el comportamiento nativo de Render y no se
    #     puede alterar desde aquí.
    #
    # Lo que sí importa, y ya se cumple: una ruta de asset inexistente ya NO
    # devuelve el index.html. Antes devolvía 200 text/html con 83 KB de HTML
    # donde el cliente esperaba JS/JSON, lo que envenenaba la caché del CDN y
    # rompía la detección de enlaces rotos. Ahora esas rutas devuelven 404
    # real o 0 bytes, nunca HTML. Ver `SECURITY.md`.
    #
    # `.png` no está en la lista de sources a propósito: es el destination.
    # Las demás extensiones (.csv, .wasm, .docx, ...) y las rutas de navegación
    # sin punto las sirve el catch-all SPA con el index.html, que es lo
    # correcto. El slug de tenant nunca lleva punto (el backend lo genera con
    # `replace(/[^a-z0-9]+/g, "-")`), así que ninguna ruta legítima cae aquí.
    #
    # Patrones de Render: `/*.ext` casa con un único segmento en la raíz
    # (`/main.js`), `/**/*.ext` con segmentos anidados (`/assets/main.js`).
    # El matcher es case-sensitive: `/*.map` captura `/foo.map` pero no
    # `/foo.MAP`. El slug de tenant nunca lleva punto (el backend lo genera
    # con `replace(/[^a-z0-9]+/g, "-")`), así que ninguna ruta de navegación
    # legítima cae en estas reglas.
    #
    # VERIFICACIÓN TRAS EL DEPLOY (todas deben devolver 404, no 200):
    #   curl -I https://tubodaonline.onrender.com/main-inexistente.js.map
    #   curl -I https://tubodaonline.onrender.com/inexistente.json
    #   curl -I https://tubodaonline.onrender.com/assets/inexistente.js
    routes:
      - type: rewrite
        source: "/*.avif"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.css"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.eot"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.gif"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.ico"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.jpg"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.js"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.json"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.map"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.mp4"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.svg"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.ttf"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.txt"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.webm"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.webp"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.woff"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.woff2"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.xml"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*.zip"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.avif"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.css"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.eot"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.gif"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.ico"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.jpg"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.js"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.json"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.map"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.mp4"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.svg"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.ttf"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.txt"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.webm"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.webp"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.woff"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.woff2"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.xml"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/**/*.zip"
        destination: "/__asset_not_found__.png"
      - type: rewrite
        source: "/*"
        destination: "/index.html"

    # -------------------------------------------------------------------------
    # #1 y #5 — Cabeceras de seguridad del frontend
    # -------------------------------------------------------------------------
    # La CSP está alineada con los recursos que la app usa de verdad:
    #   · Stripe      → js.stripe.com (script), api.stripe.com (connect),
    #                    hooks.stripe.com (frame 3DS)
    #   · Google Fonts→ fonts.googleapis.com (style), fonts.gstatic.com (font)
    #   · YouTube     → iframe del reproductor + API + thumbnails
    #   · Backend     → boda-backend-4e6z.onrender.com (connect)
    #   · OpenStreetMap → tiles del mapa (img-src https:)
    # `frame-ancestors 'none'` + `X-Frame-Options: DENY` bloquean el clickjacking
    # sobre login/registro. `X-Frame-Options` se mantiene por compatibilidad con
    # navegadores antiguos.
    #
    # Stripe (https://docs.stripe.com/security/guide):
    #   · script-src / frame-src → `https://*.js.stripe.com` permite que
    #     Stripe.js arranque frames en orígenes distintos (lo recomienda la
    #     propia documentación de Stripe).
    #   · connect-src → `https://q.stripe.com` es el origen al que Stripe.js
    #     hace XHR; sin él la consola del navegador bloquea la conexión.
    #   · `hooks.stripe.com` es el frame del Payment Element y del challenge
    #     3-D Secure. Con `redirect: 'if_required'` (ver payment.service.ts) el
    #     challenge se renderiza dentro de la propia página de Stripe, así que
    #     no hace falta `https://*.3dsecure.io`. Si algún día el 3DS se
    #     embebiera en un modal propio, habría que añadirlo a frame-src.
    headers:
      - path: "/*"
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          base-uri 'self';
          object-src 'none';
          frame-ancestors 'none';
          form-action 'self';
          script-src 'self' https://js.stripe.com https://*.js.stripe.com https://www.youtube.com https://s.ytimg.com;
          script-src-attr 'none';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com data:;
          img-src 'self' data: blob: https:;
          media-src 'self' blob: https:;
          connect-src 'self' https://boda-backend-4e6z.onrender.com https://api.stripe.com https://q.stripe.com https://www.googleapis.com;
          frame-src 'self' https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://www.youtube.com;
          worker-src 'self' blob:;
          manifest-src 'self';
          upgrade-insecure-requests

      - path: "/*"
        name: X-Frame-Options
        value: DENY

      - path: "/*"
        name: X-Content-Type-Options
        value: nosniff

      - path: "/*"
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      - path: "/*"
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(self), browsing-topics=()"

      # #5 — 1 año, alineado con el backend. Sin `preload`: el dominio raíz es
      # `onrender.com` y no lo controlamos; con `includeSubDomains` sobre un
      # subdominio de Render el preload es inútil, y 10 años es una decisión
      # que no podemos revertir si mañana necesitamos otro host.
      #
      # IMPORTANTE: Render aplica por defecto `max-age=315360000; includeSubdomains;
      # preload` (10 años) en los static sites. Esta regla debe SUSTITUIRLO, no
      # acompañarlo: si se sirven las dos, el navegador se queda con la más
      # restrictiva (10 años) y el hallazgo #5 sigue abierto.
      # Verifica con `curl -I https://tubodaonline.onrender.com/` que sale
      # UNA sola cabecera strict-transport-security con max-age=31536000.
      - path: "/*"
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"

      # El shell HTML debe revalidarse siempre para que un deploy se vea
      # inmediatamente, sin esperar a que expire la CDN.
      # No tocamos el Cache-Control de `/*`: Render ya aplica su propia
      # política (más agresiva para los assets con hash) y sobrescribirla
      # aquí solo degradaría el cacheo del bundle.
      - path: "/index.html"
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
