<section id="contact" class="section contact-section">
  <div class="section-content">
    <div class="contact-header" data-aos="fade-up">
      <h2 class="section-title">¿Alguna duda?</h2>
      <p class="section-subtitle">Estamos aquí para ayudaros con cualquier detalle</p>
    </div>

    <div class="contacts-grid">
      @for (contact of contacts(); track contact.name) {
        <div class="contact-card" data-aos="zoom-in">
          <div class="contact-icon-wrapper">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="contact-main-icon"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
              ></path>
            </svg>
          </div>
          <h3 class="contact-name">{{ contact.name }}</h3>
          <p class="contact-role">{{ contact.role }}</p>
          <a [href]="'tel:' + contact.phone.replace(' ', '')" class="contact-link">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
              ></path>
            </svg>
            {{ contact.phone }}
          </a>
          <a [href]="contact.whatsapp" target="_blank" class="whatsapp-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-11.7 1.1 1.1 0 1 1 1.8 1.1c.1.2.3.4.4.6l5.3 6.2z"
              ></path>
            </svg>
            Escríbenos por WhatsApp
          </a>
        </div>
      }
    </div>
  </div>
</section>
