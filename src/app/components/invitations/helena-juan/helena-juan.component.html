<div class="app-container">
  <app-hero [coverUrl]="coverUrl()" />

  <section id="gallery" class="section bg-light">
    <app-gallery [galleryUrls]="galleryUrls()" />
  </section>

  <section id="timeline" class="section">
    <app-timeline />
  </section>

  <section id="location" class="section bg-light">
    <app-map />
  </section>

  <section id="rsvp" class="section">
    <div class="section-content">
      <app-rsvp-form />
    </div>
  </section>

  <app-contact />
  <app-gifts />
  <app-calendar />
  <app-invitation-footer />
  <app-music-player user="helena-juan" song="background-music.mp3" />
</div>
