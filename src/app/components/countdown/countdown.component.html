<div class="countdown-container" #countdownContainer>
  <div class="countdown-header" #countdownHeader>
    <h2>Comienza la cuenta atrás</h2>
    <p>{{ partner1Name() }} & {{ partner2Name() }}</p>
  </div>

  <div class="countdown-grid" #countdownGrid>
    <div class="countdown-item">
      <div class="countdown-number">{{ timeRemaining().days }}</div>
      <div class="countdown-label">Días</div>
    </div>
    <div class="countdown-item">
      <div class="countdown-number">{{ timeRemaining().hours }}</div>
      <div class="countdown-label">Horas</div>
    </div>
    <div class="countdown-item">
      <div class="countdown-number">{{ timeRemaining().minutes }}</div>
      <div class="countdown-label">Minutos</div>
    </div>
    <div class="countdown-item">
      <div class="countdown-number">{{ timeRemaining().seconds }}</div>
      <div class="countdown-label">Segundos</div>
    </div>
  </div>
</div>
