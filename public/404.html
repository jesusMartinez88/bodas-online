<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página no encontrada · Tu Boda Online</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="La página que buscas no existe o ha cambiado de dirección." />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-ring.svg"
    />
    <style>
      :root {
        --rose: #e5006e;
        --rose-dark: #b80057;
        --ink: #241b26;
        --ink-soft: #6b5c6e;
        --paper: #fff8fb;
        --card: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background:
          radial-gradient(circle at 15% 12%, #ffe3f0 0%, transparent 45%),
          radial-gradient(circle at 85% 88%, #ffe3f0 0%, transparent 45%),
          var(--paper);
        color: var(--ink);
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 32rem;
        background: var(--card);
        border: 1px solid #f4d9e6;
        border-radius: 1.5rem;
        padding: 2.75rem 2rem 2.25rem;
        box-shadow: 0 18px 50px -28px rgba(229, 0, 110, 0.45);
      }
      .ring {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.5rem;
        border-radius: 999px;
        border: 3px solid var(--rose);
        display: grid;
        place-items: center;
        color: var(--rose);
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0 0 0.6rem;
        font-size: 1.6rem;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 auto 1.75rem;
        max-width: 26rem;
        color: var(--ink-soft);
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      .btn {
        display: inline-block;
        padding: 0.8rem 1.5rem;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        border: 1px solid transparent;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          background-color 0.15s ease;
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      .btn-primary {
        background: var(--rose);
        color: #fff;
        box-shadow: 0 12px 24px -14px rgba(229, 0, 110, 0.9);
      }
      .btn-primary:hover {
        background: var(--rose-dark);
      }
      .btn-secondary {
        background: #fff;
        color: var(--rose);
        border-color: #f4d9e6;
      }
      footer {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: var(--ink-soft);
      }
      footer a {
        color: var(--rose);
      }
      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
        .btn:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="ring" aria-hidden="true">404</div>
      <h1>Esta página no existe</h1>
      <p>
        Puede que el enlace esté mal escrito o que la invitación se haya movido. Si venías a ver una
        invitación de boda, comprueba el enlace que te compartieron.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Ir a la página principal</a>
        <a class="btn btn-secondary" href="/contacto">Contactar</a>
      </div>
      <footer>
        <a href="/">Tu Boda Online</a> · Invitaciones de boda digitales
      </footer>
    </main>
  </body>
</html>
