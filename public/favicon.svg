<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo con gradiente suave -->
  <defs>
    <linearGradient id="bgRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF0F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4E1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0BFB8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9ADA7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0BFB8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="100" height="100" rx="20" fill="url(#bgRose)"/>
  
  <!-- Anillo único grande con diamante -->
  <circle cx="50" cy="55" r="20" fill="none" stroke="url(#roseGold)" stroke-width="5"/>
  <circle cx="50" cy="55" r="16" fill="none" stroke="url(#roseGold)" stroke-width="2" opacity="0.5"/>
  
  <!-- Diamante en el anillo -->
  <path d="M 50 25 L 45 30 L 50 38 L 55 30 Z" fill="#FFB6C1" stroke="#FF69B4" stroke-width="1"/>
  <path d="M 50 25 L 52 28 L 50 32 L 48 28 Z" fill="#FFF" opacity="0.7"/>
  
  <!-- Destellos -->
  <circle cx="35" cy="45" r="2" fill="#FFB6C1" opacity="0.8"/>
  <circle cx="65" cy="45" r="2" fill="#FFB6C1" opacity="0.8"/>
  <circle cx="50" cy="70" r="2" fill="#FFB6C1" opacity="0.8"/>
</svg>
