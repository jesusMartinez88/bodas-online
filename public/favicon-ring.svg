<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo con gradiente romántico -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE5EC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5D4ED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  
  <!-- Anillo izquierdo -->
  <circle cx="35" cy="55" r="15" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="35" cy="55" r="12" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  
  <!-- Anillo derecho (entrelazado) -->
  <circle cx="55" cy="55" r="15" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="55" cy="55" r="12" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  
  <!-- Corazón arriba -->
  <path d="M 45 30 
           C 45 27, 42 25, 40 25
           C 37 25, 35 27, 35 30
           C 35 27, 33 25, 30 25
           C 27 25, 25 27, 25 30
           C 25 35, 35 42, 35 42
           C 35 42, 45 35, 45 30 Z" 
        fill="#FF69B4" opacity="0.9"/>
  
  <path d="M 75 30 
           C 75 27, 72 25, 70 25
           C 67 25, 65 27, 65 30
           C 65 27, 63 25, 60 25
           C 57 25, 55 27, 55 30
           C 55 35, 65 42, 65 42
           C 65 42, 75 35, 75 30 Z" 
        fill="#FF69B4" opacity="0.9"/>
</svg>
